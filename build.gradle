plugins {
    id 'dev.architectury.loom' version '1.0.+'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = "${project.mod_version}+mc${getMCVersion()}-${getVersionMetadata()}"
group = project.maven_group

loom {
    forge {
        mixinConfigs = [
                "sclp.mixins.json"
        ]
    }
}

repositories {
    maven { url 'https://jitpack.io' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://minecraft.guntram.de/maven/"
    }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    modImplementation "maven.modrinth:rubidium:${project.sodium_version}"
    modImplementation "maven.modrinth:textrues-rubidium-options:${project.rso_version}"
    //implementation "org.joml:joml:1.10.2"

    modImplementation "curse.maven:citadel-331936:3783096"

    // Currently using altrisi/CaffeineConfig until it is officially available through CaffeineMC's maven repository
    // Todo: Use https://github.com/TexTrueStudio/ColaMixinConfig when available
    include(modImplementation("com.github.ThinkingStudios:ColaMixinConfig:${project.caffeineconfig_version}"))
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

// ==================== 预处理宏配置 ====================
// 在 gradle.properties 中设置 before_18_1=true/false 来控制宏 BEFORE_18_1
def preprocessMacros = [
    'BEFORE_18_1': project.hasProperty('before_18_1') && project.property('before_18_1').toBoolean()
]

// 预处理任务：在 Java 编译前扫描源文件，处理 #if / #endif 条件编译
task preprocessJava(type: Sync) {
    def sourceDir = file('src/main/java')
    def tempDir = file("${project.buildDir}/preprocessed-java")

    // 设置 Sync 任务的输出目录
    destinationDir = tempDir

    // 输入输出声明
    inputs.dir(sourceDir)
    outputs.dir(tempDir)

    from(sourceDir) {
        // 复制所有非 Java 文件
        include '**/*'
        exclude '**/*.java'
    }

    doLast {
        // 处理所有 Java 文件
        sourceDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name.endsWith('.java')) {
                def relativePath = sourceDir.toPath().relativize(file.toPath()).toString()
                def targetFile = new File(tempDir, relativePath)

                // 确保目标目录存在
                targetFile.getParentFile().mkdirs()

                def lines = file.readLines('UTF-8')
                def result = []
                def skipStack = [] // 栈：记录嵌套的 #if 块是否应跳过

                for (def line : lines) {
                    def trimmed = line.trim()

                    // 处理 #if MACRO
                    def ifMatch = trimmed =~ /^#if\s+(\w+)$/
                    if (ifMatch) {
                        def macroName = ifMatch[0][1]
                        def defined = preprocessMacros.get(macroName, false)
                        // 如果外层已经在跳过，则内层也跳过；否则根据宏定义决定
                        def shouldSkip = skipStack ? true : !defined
                        skipStack.push(shouldSkip)
                        continue
                    }

                    // 处理 #else
                    if (trimmed == '#else') {
                        if (skipStack.isEmpty()) {
                            throw new GradleException("#else without matching #if in ${file}")
                        }
                        // 翻转当前层的跳过状态（仅当外层不跳过时才有效）
                        def currentSkip = skipStack.pop()
                        def outerSkipping = skipStack ? true : false
                        def newSkip = outerSkipping ? true : !currentSkip
                        skipStack.push(newSkip)
                        continue
                    }

                    // 处理 #endif
                    if (trimmed == '#endif') {
                        if (skipStack.isEmpty()) {
                            throw new GradleException("#endif without matching #if in ${file}")
                        }
                        skipStack.pop()
                        continue
                    }

                    // 普通代码行：如果当前不在跳过状态则保留
                    if (!skipStack || !skipStack[-1]) {
                        result.add(line)
                    }
                }

                if (!skipStack.isEmpty()) {
                    throw new GradleException("Unclosed #if in ${file}, missing #endif")
                }

                // 将处理后的内容写入临时文件
                targetFile.write(result.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
                logger.lifecycle("[Preprocess] Processed macros in: ${file} -> ${targetFile}")
            }
        }
    }
}

// 创建一个源集，使用预处理后的临时目录
sourceSets.main.java.srcDirs = [file("${project.buildDir}/preprocessed-java")]

// 让 Java 编译依赖预处理任务
tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    it.options.release = 17
    dependsOn preprocessJava
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from "LICENSE.txt"
    manifest.attributes([
            "Implementation-Title"  : project.archivesBaseName,
            "Implementation-Version": project.version
    ])
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(remapJar) {
                builtBy remapJar
            }
            artifact(sourcesJar) {
                builtBy remapSourcesJar
            }
        }
    }

    repositories {
        maven {
            name = "ConstructLegacy"
            url = "https://repo.constructlegacy.ru/public"
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
    }
}

def getMCVersion()
{
    if(project.property('before_18_1').toBoolean())
    {
        return "1.16.5"
    }
    return "1.18"
}

static def getVersionMetadata() {
    def build_id = System.getenv("GITHUB_RUN_NUMBER")

    // CI builds only
    if (build_id != null) {
        return "build.${build_id}"
    }
    // No tracking information could be found about the build
    return "unknown"
}